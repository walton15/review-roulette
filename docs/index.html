<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartButGameCritic</title>
<meta name="description" content="Read a Steam review with the game's name blacked out. Guess which game it is.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1116; --panel: #171c24; --panel-2: #1f2630; --line: #2c3542;
    --text: #e8ecf1; --muted: #8b97a8; --accent: #ffc53d; --good: #3ecf8e; --bad: #ff5c6c;
    --display: "Space Grotesk", system-ui, sans-serif; --serif: "Newsreader", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { min-height: 100vh; padding-inline: 16px; background:
    radial-gradient(900px 500px at 85% -10%, #ffc53d14, transparent 60%),
    radial-gradient(700px 500px at -10% 110%, #3ecf8e0f, transparent 60%), var(--bg); }
  main { max-width: 760px; margin: 0 auto; padding-block: 28px 64px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .logo { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: -.02em; }
  .logo span { color: var(--accent); }
  .hud { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-family: var(--display); font-size: 13px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--muted); }
  .chip b { color: var(--text); font-weight: 700; }
  .chip.hot { border-color: #ffc53d66; color: var(--accent); }
  .chip.hot b { color: var(--accent); }

  /* Intro / end */
  .hero { text-align: center; padding: 48px 8px 12px; }
  .hero h1 { font-family: var(--display); font-size: clamp(40px, 9vw, 72px); line-height: .95; letter-spacing: -.04em; margin: 0 0 18px; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { color: var(--muted); max-width: 480px; margin: 0 auto 30px; font-size: 17px; }
  .hero .tag { font-family: var(--display); font-size: .78em; font-weight: 700; background: var(--accent); color: #1a1405; padding: .1em .45em; border-radius: 5px; white-space: nowrap; }
  .modes { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn { font-family: var(--display); font-weight: 700; padding: 13px 22px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); transition: transform .08s, background .15s, border-color .15s; }
  .btn:hover { background: var(--panel-2); border-color: #3d4858; }
  .modes .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); color: #1a1405; border-color: var(--accent); }
  .btn.primary:hover { background: #ffd366; }
  .fine { color: var(--muted); font-size: 13px; margin-top: 26px; }
  .big-score { font-family: var(--display); font-size: clamp(64px, 16vw, 120px); font-weight: 700; line-height: 1; letter-spacing: -.05em; margin: 8px 0 4px; }
  .big-score small { font-size: .35em; color: var(--muted); letter-spacing: 0; }

  /* Round */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px 18px; position: relative; }
  .card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .verdict { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 700; font-size: 13px; padding: 3px 10px; border-radius: 999px; }
  .verdict.up { background: #3ecf8e1f; color: var(--good); }
  .verdict.down { background: #ff5c6c1f; color: var(--bad); }
  .quote { font-family: var(--serif); font-size: 19px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 360px; overflow-y: auto; padding-right: 6px; }
  .quote.short { font-size: 26px; line-height: 1.4; }
  .quote .tag { font-family: var(--display); font-size: .72em; font-weight: 700; background: var(--accent); color: #1a1405; padding: .08em .45em; border-radius: 5px; white-space: nowrap; vertical-align: .1em; }
  .quote::-webkit-scrollbar { width: 6px; } .quote::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .prompt { font-family: var(--display); font-weight: 700; margin: 22px 2px 10px; font-size: 15px; color: var(--muted); }
  @media (max-width: 560px) { .card { padding: 18px 16px 14px; } .quote { font-size: 17px; } .quote.short { font-size: 22px; } }
  .guess-row { display: flex; gap: 10px; }
  .search { position: relative; flex: 1; min-width: 0; }
  .search input { width: 100%; font: 600 17px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 16px 46px; outline: none; transition: border-color .15s, background .15s; }
  .search input::placeholder { color: var(--muted); font-weight: 400; }
  .search input:focus { border-color: var(--accent); }
  .search input:disabled { opacity: 1; }
  .search .icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search.correct input { border-color: var(--good); background: #3ecf8e17; }
  .search.wrong input { border-color: var(--bad); background: #ff5c6c17; text-decoration: line-through; text-decoration-color: #ff5c6c99; }
  .giveup { flex: none; padding-inline: 16px; color: var(--muted); }
  .suggest { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 6px); margin: 0; padding: 6px; list-style: none; background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 18px 40px #0008; max-height: 360px; overflow-y: auto; }
  .suggest li { display: flex; align-items: center; gap: 12px; padding: 7px 8px; border-radius: 9px; cursor: pointer; }
  .suggest li.active { background: #ffc53d1f; }
  .suggest li img { flex: none; width: 92px; height: 34px; object-fit: cover; border-radius: 5px; background: var(--panel); }
  .suggest li span { font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .suggest li mark { background: none; color: var(--accent); }
  .suggest .empty { color: var(--muted); cursor: default; padding: 12px; }

  .prompt-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 22px 2px 10px; }
  .prompt-row .prompt { margin: 0; }
  .lives { display: flex; gap: 6px; }
  .heart { width: 30px; height: 30px; display: block; overflow: visible; animation: heart-in .45s cubic-bezier(.3,1.6,.5,1) backwards; }
  .heart:nth-child(2) { animation-delay: .08s; } .heart:nth-child(3) { animation-delay: .16s; }
  .heart .empty { fill: none; stroke: var(--line); stroke-width: 1.6; }
  .heart .half { fill: var(--bad); transform-box: fill-box; transform-origin: 50% 90%; filter: drop-shadow(0 0 5px #ff5c6c66); }
  .lives.warn .heart:not([data-lost]) .half { animation: beat 1s ease-in-out infinite; }
  .heart.broken { animation: heart-hit .35s ease-out; }
  .heart.broken .half.l { animation: fall-l .75s cubic-bezier(.4,0,.8,.6) forwards; }
  .heart.broken .half.r { animation: fall-r .75s cubic-bezier(.4,0,.8,.6) forwards; }
  .lives.won .heart:not([data-lost]) .half { animation: won .6s ease-out; fill: var(--good); filter: drop-shadow(0 0 6px #3ecf8e88); }
  @keyframes heart-in { from { transform: scale(0); opacity: 0; } }
  @keyframes heart-hit { 0% { transform: scale(1); } 30% { transform: scale(1.35) rotate(-8deg); } 60% { transform: scale(.9) rotate(6deg); } 100% { transform: none; } }
  @keyframes fall-l { 15% { transform: translate(-2px, -1px) rotate(-12deg); opacity: 1; } 100% { transform: translate(-9px, 22px) rotate(-55deg); opacity: 0; } }
  @keyframes fall-r { 15% { transform: translate(2px, -1px) rotate(12deg); opacity: 1; } 100% { transform: translate(9px, 22px) rotate(55deg); opacity: 0; } }
  @keyframes beat { 0%, 60%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(.96); } 45% { transform: scale(1.1); } }
  @keyframes won { 40% { transform: scale(1.35) translateY(-3px); } }
  .special-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .special { flex: 1 1 160px; padding: 11px 14px; font-size: 14px; color: var(--muted); }
  .special:disabled { cursor: default; opacity: .5; }
  .special.wrong { border-color: #ff5c6c66; color: var(--bad); text-decoration: line-through; }
  .special.correct { border-color: var(--good); color: var(--good); background: #3ecf8e17; opacity: 1; }
  .fake-art { aspect-ratio: 460/215; border-radius: 10px; display: grid; place-items: center; font-size: 56px; background: repeating-linear-gradient(45deg, var(--panel-2) 0 12px, var(--panel) 12px 24px); }
  .caught { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: -14px 0 28px; }
  .tried { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; padding: 0; list-style: none; }
  .tried li { font-size: 13px; font-weight: 600; color: var(--bad); background: #ff5c6c17; border: 1px solid #ff5c6c44; border-radius: 999px; padding: 3px 10px 3px 8px; text-decoration: line-through; text-decoration-color: #ff5c6c99; animation: pop .25s ease-out; }
  .hint-btn { display: block; margin: 12px auto 0; padding: 10px 18px; font-size: 14px; border-color: #ffc53d66; color: var(--accent); animation: pop .25s ease-out; }
  .hint-btn:hover:not(:disabled) { border-color: var(--accent); }
  .hint-btn:disabled { cursor: default; opacity: .45; border-color: var(--line); color: var(--muted); background: var(--panel); }
  .hint { margin-top: 12px; animation: pop .25s ease-out; }
  .hint-label { font-family: var(--display); font-weight: 700; font-size: 13px; color: var(--muted); margin: 0 2px 8px; }
  .hint-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (max-width: 560px) { .hint-grid { grid-template-columns: 1fr; } }
  .hint-opt { display: flex; align-items: center; gap: 10px; padding: 7px 10px 7px 7px; border-radius: 12px; text-align: left; font-family: inherit; font-weight: 600; font-size: 14px; line-height: 1.25; }
  .hint-opt:hover:not(:disabled) { border-color: var(--accent); }
  .hint-opt:disabled { cursor: default; opacity: .5; }
  .hint-opt.correct { border-color: var(--good); color: var(--good); background: #3ecf8e17; opacity: 1; }
  .hint-opt.wrong { border-color: #ff5c6c66; color: var(--bad); text-decoration: line-through; opacity: 1; }
  .hint-opt img { flex: none; width: 92px; height: 34px; object-fit: cover; border-radius: 5px; background: var(--panel-2); }
  .hint-opt span { overflow-wrap: anywhere; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } .heart.broken .half { opacity: 0; } }

  .reveal { margin-top: 14px; display: grid; grid-template-columns: 230px 1fr; gap: 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; animation: pop .25s ease-out; }
  @media (max-width: 560px) { .reveal { grid-template-columns: 1fr; } }
  .reveal img { width: 100%; aspect-ratio: 460/215; object-fit: cover; border-radius: 10px; background: var(--panel-2); display: block; }
  .reveal .result { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -.01em; }
  .reveal .result.good { color: var(--good); } .reveal .result.bad { color: var(--bad); }
  .reveal .meta { color: var(--muted); font-size: 14px; margin: 2px 0 12px; }
  .reveal .meta a { color: var(--muted); }
  .reveal .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .kbd { font-size: 12px; color: var(--muted); }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
  .err { color: var(--bad); text-align: center; padding: 60px 0; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <div class="logo">SmartBut<span>Game</span>Critic</div>
    <div class="hud" id="hud" hidden>
      <div class="chip">Round <b id="h-round">1</b>/<span id="h-total">10</span></div>
      <div class="chip">Score <b id="h-score">0</b></div>
      <div class="chip" id="h-streak-chip">Streak <b id="h-streak">0</b></div>
    </div>
  </div>
  <div id="app"><p class="fine" style="text-align:center">Loading reviews…</p></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <clipPath id="crack-l"><polygon points="0,0 12.6,0 11,7.5 13.6,11.5 10.8,15.5 12.6,24 0,24"/></clipPath>
    <clipPath id="crack-r"><polygon points="12.6,0 24,0 24,24 12.6,24 10.8,15.5 13.6,11.5 11,7.5"/></clipPath>
  </defs></svg>
</main>

<script>
const PLAYER = 'SmartButAutistic';
const LIVES = 3;
const SPECIAL = { fake: { special: 'fake', name: 'Fake Review' }, stranger: { special: 'stranger', name: 'Not Sam Review' } };
const img = (appid, kind) => `https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/${appid}/${kind}.jpg`;
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

let DATA, game;

fetch('data.json', { cache: 'no-cache' }).then(r => r.json()).then(d => { DATA = d; intro(); })
  .catch(() => { $('#app').innerHTML = '<p class="err">Couldn’t load the reviews. Try refreshing.</p>'; });

function intro() {
  $('#hud').hidden = true;
  const n = DATA.reviews.length;
  const modes = [10, 25].filter(m => m < n).map(m => `<button class="btn" data-n="${m}">${m} rounds</button>`).join('');
  const decoys = (DATA.fakes?.length ? 1 : 0) + (DATA.strangers?.length ? 1 : 0);
  const best = store.get('rr-best', null);
  $('#app').innerHTML = `
    <section class="hero">
      <h1>Which game is<br><em>${esc(PLAYER)}</em> talking about?</h1>
      <p>${n} real ${esc(PLAYER)} Steam reviews where the game's name is hidden. Search his library and guess which game he's talking about. You get ${LIVES} tries per review.</p>
      ${decoys ? `<p style="margin-top:-18px">Watch out: every game sneaks in one <b style="color:var(--text)">fake</b> and one review from <b style="color:var(--text)">another Steam player</b>. Call them out with the <b style="color:var(--text)">Fake Review</b> and <b style="color:var(--text)">Not Sam Review</b> buttons.</p>` : ''}
      <div class="modes">${modes}<button class="btn" data-n="${n + decoys}">All ${n}</button></div>
      <p class="fine">Type to search, ↑↓ and Enter to pick, Enter again for the next review.${best ? ` · Your best: ${best.score}/${best.total}` : ''}</p>
    </section>`;
  $('#app').querySelectorAll('[data-n]').forEach(b => b.onclick = () => start(+b.dataset.n));
}

function start(total) {
  const pickOne = a => a[Math.random() * a.length | 0];
  const decoys = [];
  if (DATA.fakes?.length) decoys.push({ ...pickOne(DATA.fakes), kind: 'fake' });
  if (DATA.strangers?.length) decoys.push({ ...pickOne(DATA.strangers), kind: 'stranger' });
  const real = shuffle(DATA.reviews).slice(0, total - decoys.length).map(r => ({ ...r, kind: 'real' }));
  total = real.length + decoys.length;
  game = { rounds: shuffle([...real, ...decoys]), results: [], i: 0, score: 0, streak: 0, bestStreak: 0, answered: false };
  $('#hud').hidden = false;
  $('#h-total').textContent = total;
  round();
}

const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

// Every typed word must start a word in the title (or appear inside it); best matches first.
function searchGames(query) {
  const q = norm(query);
  if (!q) return [];
  const tokens = q.split(' ');
  const hits = [];
  for (const g of DATA.games) {
    const n = g.norm ??= norm(g.name), words = n.split(' ');
    let rank;
    if (n.startsWith(q)) rank = 0;
    else if (tokens.every(t => words.some(w => w.startsWith(t)))) rank = 1;
    else if (tokens.every(t => n.includes(t)) || n.replace(/ /g, '').includes(q.replace(/ /g, ''))) rank = 2;
    else continue;
    hits.push({ g, rank });
  }
  return hits.sort((a, b) => a.rank - b.rank || a.g.name.length - b.g.name.length).slice(0, 8).map(h => h.g);
}

function highlight(name, query) {
  const tokens = norm(query).split(' ').filter(Boolean).sort((a, b) => b.length - a.length);
  if (!tokens.length) return esc(name);
  const re = new RegExp(`(${tokens.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'gi');
  return name.split(re).map((part, i) => i % 2 ? `<mark>${esc(part)}</mark>` : esc(part)).join('');
}

function renderText(t) {
  return esc(t).replace(/\[(GAME TITLE|DEVELOPER|REDACTED|LINK)\]/g, '<span class="tag">$1</span>');
}

function round() {
  const r = game.rounds[game.i];
  game.answered = false;
  game.lives = LIVES;
  game.tried = [];
  updateHud();
  $('#app').innerHTML = `
    <article class="card" id="card">
      <div class="card-top">
        <span class="verdict ${r.recommended ? 'up' : 'down'}">${r.recommended ? '👍 Recommended' : '👎 Not Recommended'}</span>
        <span>review by ${esc(PLAYER)}</span>
      </div>
      <div class="quote${r.text.length < 90 ? ' short' : ''}">${renderText(r.text)}</div>
    </article>
    <div class="prompt-row">
      <div class="prompt">Which game is it?</div>
      <div class="lives" id="lives" role="img" aria-label="${LIVES} guesses left">${heartSvg().repeat(LIVES)}</div>
    </div>
    <div class="guess-row">
      <div class="search" id="search">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="text" placeholder="Start typing a game from his library…" autocomplete="off" spellcheck="false"
          role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
        <ul class="suggest" id="suggest" role="listbox" hidden></ul>
      </div>
      <button class="btn giveup" id="giveup">Give up</button>
    </div>
    <div class="special-row">
      <button class="btn special" id="btn-fake">🤖 Fake Review</button>
      <button class="btn special" id="btn-stranger">🕵️ Not Sam Review</button>
    </div>
    <ul class="tried" id="tried"></ul>
    <button class="btn hint-btn" id="hint-btn" disabled title="Unlocks on your last life">💡 Reveal a hint</button>
    <div id="hint"></div>
    <div id="reveal"></div>`;
  setupSearch();
  $('#giveup').onclick = () => answer(null);
  $('#btn-fake').onclick = () => answer(SPECIAL.fake);
  $('#btn-stranger').onclick = () => answer(SPECIAL.stranger);
  $('#hint-btn').onclick = showHint;
  window.scrollTo({ top: 0 });
  if (matchMedia('(hover: hover)').matches) $('#q').focus({ preventScroll: true });
}

function setupSearch() {
  const input = $('#q'), list = $('#suggest');
  let results = [], active = 0;
  const close = () => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); };
  const render = () => {
    results = searchGames(input.value).filter(g => !game.tried.includes(g.appid));
    active = Math.min(active, Math.max(results.length - 1, 0));
    if (!input.value.trim()) return close();
    list.innerHTML = results.length
      ? results.map((g, i) => `<li role="option" data-i="${i}" class="${i === active ? 'active' : ''}" aria-selected="${i === active}">
          <img src="${img(g.appid, 'capsule_184x69')}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
          <span>${highlight(g.name, input.value)}</span></li>`).join('')
      : '<li class="empty">No games in his library match that.</li>';
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    list.querySelector('.active')?.scrollIntoView({ block: 'nearest' });
  };
  input.oninput = () => { active = 0; render(); };
  input.onfocus = render;
  input.onkeydown = e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (results.length) { active = (active + (e.key === 'ArrowDown' ? 1 : -1) + results.length) % results.length; render(); }
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (!list.hidden && results[active]) answer(results[active]);
    } else if (e.key === 'Escape') close();
  };
  // mousedown (not click) so the pick lands before the input loses focus
  list.onmousedown = e => { const li = e.target.closest('li[data-i]'); if (li) { e.preventDefault(); answer(results[+li.dataset.i]); } };
  input.onblur = () => setTimeout(close, 100);
}

// A heart split along a jagged crack into two halves that fall apart when it breaks.
function heartSvg() {
  const d = 'M12 21.3s-7.8-4.7-10.3-9.6C0 8.1 2.2 3.6 6.4 3.6c2.4 0 4.1 1.4 5.6 3.4 1.5-2 3.2-3.4 5.6-3.4 4.2 0 6.4 4.5 4.7 8.1C19.8 16.6 12 21.3 12 21.3z';
  return `<svg class="heart" viewBox="0 0 24 24" aria-hidden="true">
    <path class="empty" d="${d}"/>
    <path class="half l" d="${d}" clip-path="url(#crack-l)"/>
    <path class="half r" d="${d}" clip-path="url(#crack-r)"/>
  </svg>`;
}

function loseLife(count = 1) {
  const hearts = [...document.querySelectorAll('#lives .heart:not([data-lost])')].reverse();
  hearts.slice(0, count).forEach((h, k) => { h.dataset.lost = ''; setTimeout(() => h.classList.add('broken'), k * 140); });
  game.lives = Math.max(0, game.lives - count);
  const lives = $('#lives');
  lives.classList.toggle('warn', game.lives === 1);
  lives.setAttribute('aria-label', `${game.lives} guess${game.lives === 1 ? '' : 'es'} left`);
  const card = $('#card');
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
}

function answer(guess) {
  if (game.answered) return;
  const r = game.rounds[game.i];
  const right = !!guess && (r.kind === 'real'
    ? !guess.special && (guess.appid === r.appid || norm(guess.name) === norm(r.name))
    : guess.special === r.kind);
  const input = $('#q');

  if (guess && !right) {
    loseLife();
    game.tried.push(guess.special || guess.appid);
    if (guess.special) { $(`#btn-${guess.special}`).classList.add('wrong'); $(`#btn-${guess.special}`).disabled = true; }
    $('#tried').insertAdjacentHTML('beforeend', `<li>${esc(guess.name)}</li>`);
    if (game.lives > 0) {
      if (game.lives === 1) { $('#hint-btn').disabled = false; $('#hint-btn').removeAttribute('title'); }
      input.value = '';
      $('#suggest').hidden = true;
      input.placeholder = `Nope. ${game.lives} guess${game.lives === 1 ? '' : 'es'} left…`;
      input.focus({ preventScroll: true });
      return;
    }
  }
  if (!guess) loseLife(game.lives);

  game.answered = true;
  const guessNo = game.tried.length + 1;
  if (right) { game.score++; game.streak++; game.bestStreak = Math.max(game.bestStreak, game.streak); $('#lives').classList.add('won'); }
  else game.streak = 0;
  input.value = right ? guess.name : guess ? 'Out of guesses' : 'Gave up';
  input.disabled = true;
  $('#suggest').hidden = true;
  $('#search').classList.add(right ? 'correct' : 'wrong');
  $('#giveup').hidden = true;
  document.querySelectorAll('.special, .hint-opt').forEach(b => b.disabled = true);
  $('#hint-btn').hidden = true;
  if (r.kind === 'real') document.querySelector(`.hint-opt[data-appid="${r.appid}"]`)?.classList.add('correct');
  if (r.kind !== 'real') $(`#btn-${r.kind}`).classList.add('correct');
  game.results[game.i] = right;
  updateHud();
  const last = game.i === game.rounds.length - 1;
  const cheers = r.kind === 'fake' ? ['Good eye. That was a fake.', 'Busted. He never wrote that.']
    : r.kind === 'stranger' ? ['Busted! Not his review.', 'Good catch. Someone else wrote that.']
    : ['Nailed it.', 'Correct!', 'You know him too well.', 'Easy.', 'Yep!'];
  const jeers = r.kind === 'fake' ? ['Gotcha. That review was fake.'] : r.kind === 'stranger' ? ['Gotcha. Sam didn’t write that one.']
    : ['Nope.', 'Not quite.', 'Miss!', 'So close. (Maybe.)'];
  const art = r.kind === 'fake' ? '<div class="fake-art" aria-hidden="true">🤖</div>'
    : `<img src="${img(r.appid, 'header')}" alt="${esc(r.name)}" onerror="this.style.display='none'">`;
  const meta = r.kind === 'fake' ? 'A fake written in his style. He never posted this.'
    : `${r.kind === 'stranger' ? 'Another Steam player wrote this about' : 'It was'} <b style="color:var(--text)">${esc(r.name)}</b>${r.hours ? ` · ${esc(r.hours)}` : ''}${r.url ? ` · <a href="${esc(r.url)}" target="_blank" rel="noopener">original review</a>` : ''}`;
  const pick = a => a[Math.random() * a.length | 0];
  $('#reveal').innerHTML = `
    <div class="reveal">
      ${art}
      <div>
        <div class="result ${right ? 'good' : 'bad'}">${right ? (guessNo === 1 ? pick(cheers) : `Got it on guess ${guessNo}.`) : pick(jeers)}</div>
        <div class="meta">${meta}</div>
        <div class="row"><button class="btn primary" id="next">${last ? 'See results' : 'Next review'} →</button><span class="kbd">or press Enter</span></div>
      </div>
    </div>`;
  $('#next').onclick = next;
  $('#next').focus({ preventScroll: true });
  $('#reveal').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// Last-life hint: four games from the library. For a real review one of them is the answer;
// for a fake or someone else's review, none of them are.
function showHint() {
  const r = game.rounds[game.i];
  if (game.answered || game.lives !== 1 || $('#hint .hint-opt')) return;
  $('#hint-btn').hidden = true;
  const answerId = r.kind === 'real' ? r.appid : null;
  const pool = shuffle(DATA.games.filter(g => g.appid !== answerId && !game.tried.includes(g.appid)));
  const options = shuffle(answerId ? [{ appid: r.appid, name: r.name }, ...pool.slice(0, 3)] : pool.slice(0, 4));
  $('#hint').innerHTML = `
    <div class="hint">
      <div class="hint-label">💡 Hint: is it one of these?</div>
      <div class="hint-grid">${options.map((g, i) => `<button class="btn hint-opt" data-i="${i}" data-appid="${g.appid}">
        <img src="${img(g.appid, 'capsule_184x69')}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <span>${esc(g.name)}</span></button>`).join('')}</div>
    </div>`;
  $('#hint').querySelectorAll('.hint-opt').forEach(b => b.onclick = () => {
    const g = options[+b.dataset.i];
    const right = r.kind === 'real' && g.appid === r.appid;
    if (!right) b.classList.add('wrong');
    answer(g);
  });
  $('#hint').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function next() {
  if (!game.answered) return;
  if (++game.i < game.rounds.length) round(); else finish();
}

function finish() {
  $('#hud').hidden = true;
  const { score } = game, total = game.rounds.length, pct = score / total;
  const best = store.get('rr-best', null);
  const isBest = !best || pct > best.score / best.total;
  if (isBest) store.set('rr-best', { score, total });
  const verdict = pct === 1 ? `Perfect. Are you ${esc(PLAYER)}?` : pct >= .8 ? 'Certified best friend.' : pct >= .6 ? 'You clearly pay attention.' : pct >= .4 ? 'Decent. You’ve heard him talk.' : pct > .2 ? 'A few lucky guesses.' : 'Do you actually know this guy?';
  $('#app').innerHTML = `
    <section class="hero">
      <p style="margin-bottom:0">${verdict}</p>
      <div class="big-score">${score}<small> / ${total}</small></div>
      <p>Best streak: ${game.bestStreak}${isBest ? ' · <b style="color:var(--accent)">New personal best!</b>' : ''}</p>
      <div class="caught">${game.rounds.map((r, i) => r.kind === 'real' ? '' : `<span class="chip${game.results[i] ? ' hot' : ''}">${r.kind === 'fake' ? '🤖 Fake' : '🕵️ Not Sam'}: <b>${game.results[i] ? 'caught' : 'missed'}</b></span>`).join('')}</div>
      <div class="modes"><button class="btn primary" id="again">Play again</button><button class="btn" id="menu">Change length</button></div>
    </section>`;
  $('#again').onclick = () => start(total);
  $('#menu').onclick = intro;
}

function updateHud() {
  $('#h-round').textContent = game.i + 1;
  $('#h-score').textContent = game.score;
  $('#h-streak').textContent = game.streak;
  $('#h-streak-chip').classList.toggle('hot', game.streak >= 3);
}

document.addEventListener('keydown', e => {
  if (!game || $('#hud').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  if (game.answered && e.key === 'Enter' && document.activeElement?.id !== 'next') { e.preventDefault(); next(); }
  else if (!game.answered && e.key === '/' && document.activeElement?.id !== 'q') { e.preventDefault(); $('#q').focus(); }
});
</script>
